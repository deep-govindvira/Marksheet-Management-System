version: '3.8'

services:

  nginx:
    image: nginx:alpine
    container_name: mms-nginx
    ports:
      - "80:80"
      - "443:443"
    # volumes:
    #   - ./nginx.conf:/etc/nginx/nginx.conf
    #   - ./certs:/etc/nginx/certs
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - mms-frontend
      - mms-backend
      - mms-ml
    restart: unless-stopped
    networks:
      - mms-network

  mms-frontend:
    container_name: mms-frontend
    build:
      context: ./fe-marksheet-processing
      dockerfile: Dockerfile
      args:
        REACT_APP_SERVER_URL: ${REACT_APP_SERVER_URL}
    image: mms-frontend:latest
    env_file:
      - ./fe-marksheet-processing/.env
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - mms-network

  mms-backend:
    container_name: mms-backend
    build:
      context: ./be-marksheet-processing
      dockerfile: Dockerfile
    image: mms-backend:latest
    env_file:
      - ./be-marksheet-processing/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mms-network

  mms-ml:
    container_name: mms-ml
    build:
      context: ./ml-marksheet-processing
      dockerfile: Dockerfile
    image: mms-ml:latest
    env_file:
      - ./ml-marksheet-processing/.env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - mms-network

  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - mms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mms-network

  s3:
    image: minio/minio:latest
    container_name: local-s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    restart: unless-stopped
    networks:
      - mms-network

volumes:
  postgres_data:
  s3_data:

networks:
  mms-network:
    name: mms-network
    driver: bridge