name: "Technical Debt (Backend)"
description: "Track backend technical debt with remediation notes and impact."
title: "Tech-Debt: "
labels: ["tech-debt", "backend"]
type: "⚫ Tech Debt"

body:
  - type: textarea
    id: description
    attributes:
      label: "Description of debt"
      description: "Explain the underlying technical problem, legacy code, or poor design."
      placeholder: |
        Example:
        The authentication middleware has grown too large and mixes multiple concerns.
        Hard to test and slows down onboarding for new developers.

  - type: textarea
    id: impact
    attributes:
      label: "Impact (performance / maintainability / cost)"
      description: "Describe how this debt negatively affects the system."
      placeholder: |
        Examples:
        - Performance degradation
        - Tests failing intermittently
        - Difficult to maintain or extend

  - type: textarea
    id: remediation
    attributes:
      label: "Suggested remediation"
      description: "Explain the fix or approach to remove this debt."
      placeholder: |
        Example:
        Break middleware into smaller composable filters.
        Introduce dedicated authentication pipeline.

  - type: input
    id: effort
    attributes:
      label: "Estimated effort (person-days)"
      description: "Enter a numeric estimate. (GitHub Issue Forms do not support numeric inputs.)"
      placeholder: "2"
