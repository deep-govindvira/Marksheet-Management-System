name: "Bug (Backend – Python / ML Backend)"
description: "Bug report for backend (Python REST APIs, ML/LLM-ready). Include reproduction steps, logs, and expected behavior."
title: "Bug: "
labels: ["bug", "backend"]
type: "🔴 Bug"

body:
  - type: markdown
    attributes:
      value: "**Please include logs, tracebacks, request IDs, and any relevant correlation IDs if available.**"

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Environment details (dev, stage, prod), service name, version."
      placeholder: |
        Environment: dev
        Service: prediction-service
        Version: 0.9.3

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Call POST /api/v1/predict
        2. Send malformed input payload
        3. Observe 500 Internal Server Error

  - type: textarea
    id: observed
    attributes:
      label: "Observed behavior"
      placeholder: "Describe what actually happened."

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: "Describe what you expected to happen."

  - type: textarea
    id: logs
    attributes:
      label: "Relevant logs / stack trace"
      placeholder: |
        Paste Python traceback, logs, or error output here.
        Include timestamps and request IDs if possible.

  - type: textarea
    id: model_context
    attributes:
      label: "Model / inference context (if applicable)"
      description: "Model name, version, provider (OpenAI, HF, custom), or inference mode involved."
      placeholder: |
        Model: custom-xgboost-v2
        Inference type: batch / realtime
        Provider: internal

  - type: textarea
    id: impact
    attributes:
      label: "Impact / severity"
      description: "Describe how severe the bug is (P0, P1, P2)."
      placeholder: "P1 – impacts prediction accuracy for a subset of requests"

  - type: checkboxes
    id: checklist
    attributes:
      label: "Remediation checklist"
      options:
        - label: "Reproducible on the specified environment"
        - label: "Root cause analysis completed"
        - label: "Fix validated with test case"
        - label: "Hotfix / rollback required?"
